  <header class="topbar">
    <a class="brand" href="./">
      <span class="logo" aria-hidden="true">
        <svg width="20" height="25" viewBox="0 0 303 374" fill="currentColor"><use href="#khanda"/></svg>
      </span>
      <span class="name">SikhNet Assistant</span>
      <span class="pill">Moderators</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a class="nav-link" href="./">Ask</a>
      <a class="nav-link" href="community.html">Community</a>
    </nav>
  </header>

  <main class="board mod">
    <section class="board-hero">
      <p class="kicker"><span class="kicker-dot" aria-hidden="true"></span>Moderation</p>
      <h1>Keep it <em>safe</em>.</h1>
      <p class="lede">Crisis messages first, then held and reported posts. Low-rated answers show where SikhNet's archive may need an update.</p>
    </section>
    <form class="post-card mod-login" id="mod-login" autocomplete="off">
      <div class="field">
        <label for="mod-token">Moderator token <span class="opt">(not needed on this computer when SIKHNET_ADMIN_TOKEN isn't set)</span></label>
        <input id="mod-token" type="password" placeholder="SIKHNET_ADMIN_TOKEN" />
      </div>
      <button type="submit" class="btn-accent">Open queue</button>
      <div class="form-msg" id="mod-msg" role="status"></div>
    </form>
    <div id="mod-app" hidden>
      <dl class="stats mod-stats" id="mod-stats"></dl>
      <div class="tabs" role="tablist">
        <button type="button" class="tab on" data-tab="held" role="tab">Held</button>
        <button type="button" class="tab" data-tab="reported" role="tab">Reported</button>
        <button type="button" class="tab" data-tab="low" role="tab" title="Low-rated answers">Low-rated</button>
        <button type="button" class="tab" data-tab="log" role="tab">Activity</button>
      </div>
      <div id="mod-list" class="mod-list" aria-live="polite"></div>
      <p class="fineprint-left">Tip: open the <a href="community.html" data-modmode>community board in moderator mode</a> to mark great replies as ✓ verified.</p>
    </div>
  </main>
  <script src="common.js"></script>
  <script src="moderate.js"></script>
</body>
</html>
